# Managed by setup-gateway-router.sh - do not edit by hand.

#--- Forwarding --------------------------------------------------------------
# The single switch that turns a host into a router, per address family.
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1

#--- IPv6 router advertisements ---------------------------------------------
# Linux ignores incoming RAs once forwarding is enabled, UNLESS accept_ra=2.
# We need the ISP's RA on the WAN side for the default route, while refusing
# RAs on every internal interface (we are the one sending them there).
net.ipv6.conf.enp1s0.accept_ra = 2
net.ipv6.conf.enp1s0.autoconf = 1
net.ipv6.conf.enp1s0.accept_ra_defrtr = 1
# Do not let the uplink inject more specific routes into our table.
net.ipv6.conf.enp1s0.accept_ra_rtr_pref = 0
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0

#--- Anti-spoofing ----------------------------------------------------------
# rp_filter=1 is strict reverse-path filtering: drop packets arriving on an
# interface the reply would not leave by. Set to 2 (loose) if you ever run
# asymmetric/multipath routing, otherwise leave strict.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv4.conf.all.log_martians = 1

#--- ICMP redirects ---------------------------------------------------------
# A router with a complete routing table neither needs nor should emit these.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0

#--- Connection tracking ----------------------------------------------------
# Size the table for the number of concurrent flows you expect; each entry is
# roughly 300 bytes. 262144 entries is a sane small-site default.
net.netfilter.nf_conntrack_max = 262144
net.netfilter.nf_conntrack_tcp_timeout_established = 86400
net.ipv4.tcp_syncookies = 1

#--- Neighbour tables -------------------------------------------------------
# Defaults (128/512/1024) overflow on flat networks with many hosts.
net.ipv4.neigh.default.gc_thresh1 = 1024
net.ipv4.neigh.default.gc_thresh2 = 4096
net.ipv4.neigh.default.gc_thresh3 = 8192
net.ipv6.neigh.default.gc_thresh1 = 1024
net.ipv6.neigh.default.gc_thresh2 = 4096
net.ipv6.neigh.default.gc_thresh3 = 8192

#--- Multicast / OSPF -------------------------------------------------------
# FRR needs to send to link-local multicast groups on internal links.
net.ipv4.conf.all.mc_forwarding = 0
net.ipv6.conf.all.mc_forwarding = 0

#--- Per-VLAN interface hardening -----------------------------------------
# VLAN 1 (default)
net.ipv6.conf.vln1.accept_ra = 0
net.ipv6.conf.vln1.autoconf = 0
net.ipv6.conf.vln1.accept_redirects = 0
net.ipv4.conf.vln1.send_redirects = 0
# VLAN 2 (wifi)
net.ipv6.conf.vln2.accept_ra = 0
net.ipv6.conf.vln2.autoconf = 0
net.ipv6.conf.vln2.accept_redirects = 0
net.ipv4.conf.vln2.send_redirects = 0
# VLAN 3 (iot)
net.ipv6.conf.vln3.accept_ra = 0
net.ipv6.conf.vln3.autoconf = 0
net.ipv6.conf.vln3.accept_redirects = 0
net.ipv4.conf.vln3.send_redirects = 0
# VLAN 4 (dmz)
net.ipv6.conf.vln4.accept_ra = 0
net.ipv6.conf.vln4.autoconf = 0
net.ipv6.conf.vln4.accept_redirects = 0
net.ipv4.conf.vln4.send_redirects = 0
# VLAN 5 (guest)
net.ipv6.conf.vln5.accept_ra = 0
net.ipv6.conf.vln5.autoconf = 0
net.ipv6.conf.vln5.accept_redirects = 0
net.ipv4.conf.vln5.send_redirects = 0
# VLAN 99 (mgmt)
net.ipv6.conf.vln99.accept_ra = 0
net.ipv6.conf.vln99.autoconf = 0
net.ipv6.conf.vln99.accept_redirects = 0
net.ipv4.conf.vln99.send_redirects = 0
