// Managed by setup-gateway-router.sh - do not edit by hand.
// Validate with:  kea-dhcp6 -t /etc/kea/kea-dhcp6.conf
{
"Dhcp6": {

    "interfaces-config": {
        "interfaces": [ "vln1", "vln2", "vln3", "vln4", "vln5", "vln99" ],
        "service-sockets-require-all": true
    },

    "control-socket": {
        "socket-type": "unix",
        "socket-name": "/run/kea/kea6-ctrl-socket"
    },

    "lease-database": {
        "type": "memfile",
        "persist": true,
        "name": "/var/lib/kea/kea-leases6.csv",
        "lfc-interval": 3600
    },

    "expired-leases-processing": {
        "reclaim-timer-wait-time": 10,
        "flush-reclaimed-timer-wait-time": 25,
        "hold-reclaimed-time": 3600,
        "max-reclaim-leases": 100,
        "max-reclaim-time": 250
    },

    // IPv6 distinguishes preferred (still usable for new connections) from
    // valid (existing connections may continue) lifetimes.
    "preferred-lifetime": 3600,
    "valid-lifetime": 7200,
    "renew-timer": 1800,
    "rebind-timer": 2880,

    "multi-threading": {
        "enable-multi-threading": true,
        "thread-pool-size": 0,
        "packet-queue-size": 64
    },

    // Kea must know how clients are identified. DUID is the IPv6 norm;
    // MAC-based identifiers are derived where the transport allows it.
    "server-id": {
        "type": "LLT",
        "htype": 0,
        "identifier": "",
        "time": 0,
        "persist": true
    },

    // Same DDNS forwarder as DHCPv4, so a dual-stack host ends up with
    // matching A and AAAA records under one name.
    "dhcp-ddns": {
        "enable-updates": true,
        "server-ip": "127.0.0.1",
        "server-port": 53001,
        "sender-ip": "127.0.0.1",
        "max-queue-size": 1024,
        "ncr-protocol": "UDP",
        "ncr-format": "JSON"
    },
    "ddns-send-updates": true,
    "ddns-qualifying-suffix": "internal",
    "ddns-override-client-update": true,
    "ddns-override-no-update": true,
    "ddns-replace-client-name": "when-not-present",
    "ddns-generated-prefix": "host6",
    "hostname-char-set": "[^A-Za-z0-9.-]",
    "hostname-char-replacement": "-",

    "option-data": [
        { "name": "domain-search", "data": "internal" }
    ],

    "subnet6": [
        {
            // ---- VLAN 1 : default (trusted) ----
            // Reuse the DHCPv4 subnet id so the two families line up in logs.
            "id": 1,
            "subnet": "2001:db8:1000:1::/64",
            "interface": "vln1",
            "pools": [ { "pool": "2001:db8:1000:1::1000 - 2001:db8:1000:1::1fff" } ],
            // rapid-commit collapses the four-message exchange into two.
            "rapid-commit": true,
            "option-data": [
                // Point clients at the router's own global address. The ULA
                // address would also work and survives an ISP renumber.
                { "name": "dns-servers", "data": "2001:db8:1000:1::1" },
                { "name": "domain-search", "data": "internal" }
            ],
            // Prefix delegation to downstream routers would go here:
            // "pd-pools": [ { "prefix": "...", "prefix-len": 56,
            //                 "delegated-len": 60 } ],
            "reservations": [
                // {
                //     "duid": "01:02:03:04:05:06:07:08",
                //     "ip-addresses": [ "2001:db8:1000:1::1" ],
                //     "hostname": "example-host"
                // }
            ]
        }
,
        {
            // ---- VLAN 2 : wifi (trusted) ----
            // Reuse the DHCPv4 subnet id so the two families line up in logs.
            "id": 2,
            "subnet": "2001:db8:1000:2::/64",
            "interface": "vln2",
            "pools": [ { "pool": "2001:db8:1000:2::1000 - 2001:db8:1000:2::1fff" } ],
            // rapid-commit collapses the four-message exchange into two.
            "rapid-commit": true,
            "option-data": [
                // Point clients at the router's own global address. The ULA
                // address would also work and survives an ISP renumber.
                { "name": "dns-servers", "data": "2001:db8:1000:2::1" },
                { "name": "domain-search", "data": "internal" }
            ],
            // Prefix delegation to downstream routers would go here:
            // "pd-pools": [ { "prefix": "...", "prefix-len": 56,
            //                 "delegated-len": 60 } ],
            "reservations": [
                // {
                //     "duid": "01:02:03:04:05:06:07:08",
                //     "ip-addresses": [ "2001:db8:1000:2::1" ],
                //     "hostname": "example-host"
                // }
            ]
        }
,
        {
            // ---- VLAN 3 : iot (restricted) ----
            // Reuse the DHCPv4 subnet id so the two families line up in logs.
            "id": 3,
            "subnet": "2001:db8:1000:3::/64",
            "interface": "vln3",
            "pools": [ { "pool": "2001:db8:1000:3::1000 - 2001:db8:1000:3::1fff" } ],
            // rapid-commit collapses the four-message exchange into two.
            "rapid-commit": true,
            "option-data": [
                // Point clients at the router's own global address. The ULA
                // address would also work and survives an ISP renumber.
                { "name": "dns-servers", "data": "2001:db8:1000:3::1" },
                { "name": "domain-search", "data": "internal" }
            ],
            // Prefix delegation to downstream routers would go here:
            // "pd-pools": [ { "prefix": "...", "prefix-len": 56,
            //                 "delegated-len": 60 } ],
            "reservations": [
                // {
                //     "duid": "01:02:03:04:05:06:07:08",
                //     "ip-addresses": [ "2001:db8:1000:3::1" ],
                //     "hostname": "example-host"
                // }
            ]
        }
,
        {
            // ---- VLAN 4 : dmz (dmz) ----
            // Reuse the DHCPv4 subnet id so the two families line up in logs.
            "id": 4,
            "subnet": "2001:db8:1000:4::/64",
            "interface": "vln4",
            "pools": [ { "pool": "2001:db8:1000:4::1000 - 2001:db8:1000:4::1fff" } ],
            // rapid-commit collapses the four-message exchange into two.
            "rapid-commit": true,
            "option-data": [
                // Point clients at the router's own global address. The ULA
                // address would also work and survives an ISP renumber.
                { "name": "dns-servers", "data": "2001:db8:1000:4::1" },
                { "name": "domain-search", "data": "internal" }
            ],
            // Prefix delegation to downstream routers would go here:
            // "pd-pools": [ { "prefix": "...", "prefix-len": 56,
            //                 "delegated-len": 60 } ],
            "reservations": [
                // {
                //     "duid": "01:02:03:04:05:06:07:08",
                //     "ip-addresses": [ "2001:db8:1000:4::1" ],
                //     "hostname": "example-host"
                // }
            ]
        }
,
        {
            // ---- VLAN 5 : guest (dmz) ----
            // Reuse the DHCPv4 subnet id so the two families line up in logs.
            "id": 5,
            "subnet": "2001:db8:1000:5::/64",
            "interface": "vln5",
            "pools": [ { "pool": "2001:db8:1000:5::1000 - 2001:db8:1000:5::1fff" } ],
            // rapid-commit collapses the four-message exchange into two.
            "rapid-commit": true,
            "option-data": [
                // Point clients at the router's own global address. The ULA
                // address would also work and survives an ISP renumber.
                { "name": "dns-servers", "data": "2001:db8:1000:5::1" },
                { "name": "domain-search", "data": "internal" }
            ],
            // Prefix delegation to downstream routers would go here:
            // "pd-pools": [ { "prefix": "...", "prefix-len": 56,
            //                 "delegated-len": 60 } ],
            "reservations": [
                // {
                //     "duid": "01:02:03:04:05:06:07:08",
                //     "ip-addresses": [ "2001:db8:1000:5::1" ],
                //     "hostname": "example-host"
                // }
            ]
        }
,
        {
            // ---- VLAN 99 : mgmt (mgmt) ----
            // Reuse the DHCPv4 subnet id so the two families line up in logs.
            "id": 99,
            "subnet": "2001:db8:1000:99::/64",
            "interface": "vln99",
            "pools": [ { "pool": "2001:db8:1000:99::1000 - 2001:db8:1000:99::1fff" } ],
            // rapid-commit collapses the four-message exchange into two.
            "rapid-commit": true,
            "option-data": [
                // Point clients at the router's own global address. The ULA
                // address would also work and survives an ISP renumber.
                { "name": "dns-servers", "data": "2001:db8:1000:99::1" },
                { "name": "domain-search", "data": "internal" }
            ],
            // Prefix delegation to downstream routers would go here:
            // "pd-pools": [ { "prefix": "...", "prefix-len": 56,
            //                 "delegated-len": 60 } ],
            "reservations": [
                // {
                //     "duid": "01:02:03:04:05:06:07:08",
                //     "ip-addresses": [ "2001:db8:1000:99::1" ],
                //     "hostname": "example-host"
                // }
            ]
        }

    ],

    "loggers": [
        {
            "name": "kea-dhcp6",
            "output_options": [
                { "output": "syslog", "pattern": "%-5p %m\n" },
                {
                    "output": "/var/log/kea/kea-dhcp6.log",
                    "maxsize": 10485760,
                    "maxver": 5,
                    "flush": true
                }
            ],
            "severity": "INFO",
            "debuglevel": 0
        }
    ]
}
}
