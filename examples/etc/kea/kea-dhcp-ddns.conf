// Managed by setup-gateway-router.sh - do not edit by hand.
// Contains the TSIG secret: keep mode 640.
{
"DhcpDdns": {

    // Listen only on the loopback - the DHCP servers are on the same host.
    "ip-address": "127.0.0.1",
    "port": 53001,
    "control-socket": {
        "socket-type": "unix",
        "socket-name": "/run/kea/kea-ddns-ctrl-socket"
    },

    // Drop update requests for names outside our zones rather than
    // forwarding them somewhere unexpected.
    "dns-server-timeout": 500,
    "ncr-protocol": "UDP",
    "ncr-format": "JSON",

    // -------------------------------------------------------------------
    // The key must match /etc/bind/keys/ddns-key.key exactly.
    // -------------------------------------------------------------------
    "tsig-keys": [
        {
            "name": "ddns-key",
            "algorithm": "HMAC-SHA256",
            "secret": "prXyKaw3u9Npi6YVez/zWoLcES68LbGunuAz21CN2Ko="
        }
    ],

    // -------------------------------------------------------------------
    // Forward zone: A and AAAA records for leased hosts.
    // -------------------------------------------------------------------
    "forward-ddns": {
        "ddns-domains": [
            {
                "name": "internal.",
                "key-name": "ddns-key",
                "dns-servers": [ { "ip-address": "127.0.0.1", "port": 53 } ]
            }
        ]
    },

    // -------------------------------------------------------------------
    // Reverse zones: one per IPv4 /24 plus the IPv6 /48 cuts. Kea matches
    // the longest suffix, so listing the /48s covers every VLAN /64.
    // -------------------------------------------------------------------
    "reverse-ddns": {
        "ddns-domains": [
            {
                // VLAN 1 (default)
                "name": "1.11.10.in-addr.arpa.",
                "key-name": "ddns-key",
                "dns-servers": [ { "ip-address": "127.0.0.1", "port": 53 } ]
            }
,
            {
                // VLAN 2 (wifi)
                "name": "2.11.10.in-addr.arpa.",
                "key-name": "ddns-key",
                "dns-servers": [ { "ip-address": "127.0.0.1", "port": 53 } ]
            }
,
            {
                // VLAN 3 (iot)
                "name": "3.11.10.in-addr.arpa.",
                "key-name": "ddns-key",
                "dns-servers": [ { "ip-address": "127.0.0.1", "port": 53 } ]
            }
,
            {
                // VLAN 4 (dmz)
                "name": "4.11.10.in-addr.arpa.",
                "key-name": "ddns-key",
                "dns-servers": [ { "ip-address": "127.0.0.1", "port": 53 } ]
            }
,
            {
                // VLAN 5 (guest)
                "name": "5.11.10.in-addr.arpa.",
                "key-name": "ddns-key",
                "dns-servers": [ { "ip-address": "127.0.0.1", "port": 53 } ]
            }
,
            {
                // VLAN 99 (mgmt)
                "name": "99.11.10.in-addr.arpa.",
                "key-name": "ddns-key",
                "dns-servers": [ { "ip-address": "127.0.0.1", "port": 53 } ]
            }
,
            {
                // 2001:db8:1000::/48
                "name": "0.0.0.1.8.b.d.0.1.0.0.2.ip6.arpa.",
                "key-name": "ddns-key",
                "dns-servers": [ { "ip-address": "127.0.0.1", "port": 53 } ]
            }
,
            {
                // fd09:10:11::/48
                "name": "1.1.0.0.0.1.0.0.9.0.d.f.ip6.arpa.",
                "key-name": "ddns-key",
                "dns-servers": [ { "ip-address": "127.0.0.1", "port": 53 } ]
            }

        ]
    },

    "loggers": [
        {
            "name": "kea-dhcp-ddns",
            "output_options": [
                { "output": "syslog", "pattern": "%-5p %m\n" },
                {
                    "output": "/var/log/kea/kea-ddns.log",
                    "maxsize": 10485760,
                    "maxver": 5
                }
            ],
            "severity": "INFO",
            "debuglevel": 0
        }
    ]
}
}
