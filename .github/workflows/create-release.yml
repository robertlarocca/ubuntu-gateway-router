# Visit https://docs.github.com/en/actions for more information about using
# GitHub Actions and learn how-to build custom automated CI/CD workflows

# Visit https://cli.github.com/manual/gh_release_create for more information
# about using and how-to create GitHub repository releases with CLI tools

name: "Release"
run-name: "Release ${{ github.ref_name }} by @${{ github.actor }}"
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v20[0-9][0-9][0-1][0-9][0-3][0-9]'
      - 'main/v[0-9]+.[0-9]+.[0-9]+**'
      - 'main/v20[0-9][0-9][0-1][0-9][0-3][0-9]**'
      - 'pro/v[0-9]+.[0-9]+.[0-9]+**'
      - 'pro/v20[0-9][0-9][0-1][0-9][0-3][0-9]**'
      - 'release/v[0-9]+.[0-9]+.[0-9]+**'
      - 'release/v20[0-9][0-9][0-1][0-9][0-3][0-9]**'
      - 'stable/v[0-9]+.[0-9]+.[0-9]+**'
      - 'stable/v20[0-9][0-9][0-1][0-9][0-3][0-9]**'
      - 'v[0-9]+.[0-9]+.[0-9]+-main*'
      - 'v[0-9]+.[0-9]+.[0-9]+-pro*'
      - 'v[0-9]+.[0-9]+.[0-9]+-release*'
      - 'v[0-9]+.[0-9]+.[0-9]+-stable*'
      - 'v20[0-9][0-9][0-1][0-9][0-3][0-9]-main*'
      - 'v20[0-9][0-9][0-1][0-9][0-3][0-9]-pro*'
      - 'v20[0-9][0-9][0-1][0-9][0-3][0-9]-release*'
      - 'v20[0-9][0-9][0-1][0-9][0-3][0-9]-stable*'

permissions:
  contents: write  # Required to use GitHub Workflow actions
  id-token: write  # Required to request an OpenID Connect token

env:
  GITHUB_TOKEN: "${{ secrets.github_token }}"
  RUNNER_ARCH: "amd64, arm64, armhf, ppc64le, riscv64, s390x"
  RUNNER_OS: "macOS-latest, ubuntu-latest, windows-latest"

jobs:
  create:
    name: "Create Release"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        id: checkout
        uses: actions/checkout@v5

      - name: "Setup environment"
        id: setup-environment
        run: |
          echo "OWNER_NAME=$(tr '[:upper:]' '[:lower:]' <<< $GITHUB_REPOSITORY | cut -d'/' -f1 | tr '_' '-')" >> "$GITHUB_ENV"
          echo "REPO_NAME=$(tr '[:upper:]' '[:lower:]' <<< $GITHUB_REPOSITORY | cut -d'/' -f2 | tr '_' '-')" >> "$GITHUB_ENV"

      - name: "GitHub release"
        id: github-release
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          gh release create \
            "${{ github.ref_name }}" \
            --generate-notes \
            --latest=true \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --verify-tag
            # "${{ runner.temp }}/artifact.tar.gz" \
            # "${{ runner.temp }}/artifact.zip"
